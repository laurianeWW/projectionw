name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Decompresser et publier sur la branche gh-pages
        run: |
          mkdir _site
          unzip -q site-projectionw.zip -d _site
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication du site"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
